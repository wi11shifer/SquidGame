name: Unity Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unity Tests
    runs-on: ubuntu-latest

    steps:
      # Checkout коду з репозиторію
      - uses: actions/checkout@v3

      # Кешування Unity для прискорення роботи
      - uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # Встановлення Unity та запуск тестів
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.34f1  # Вкажіть вашу версію Unity
          testMode: all           # Запуск усіх тестів (EditMode + PlayMode)
          artifactsPath: artifacts

      # Завантаження результатів тестів як артефакти
      - uses: actions/upload-artifact@v3
        with:
          name: Test Results
          path: artifacts
